<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interní kalkulačka dopravy | VAG Coding</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="padding-top: 50px;">

    <section class="services-section">
        <div class="container">
            <h2 class="section-title">Interní kalkulačka dopravy</h2>
            <p class="section-subtitle">Tato stránka slouží pouze pro interní potřeby administrátora.</p>
            
            <div style="max-width: 500px; margin: 0 auto; background-color: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 8px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
                <label for="distance" style="display: block; font-weight: 600; margin-bottom: 10px; color: var(--text-main); font-size: 0.95rem;">Vzdálenost k zákazníkovi (v km):</label>
                <input type="number" id="distance" min="0" placeholder="Zadejte počet km" oninput="calculateTravel()" style="width: 100%; padding: 10px; background-color: var(--bg-dark); border: 1px solid var(--border); color: #fff; border-radius: 5px; font-size: 1.1rem; text-align: center; font-weight: bold; margin-bottom: 20px; outline: none;">
                
                <div style="border-top: 1px dashed var(--border); padding-top: 15px;">
                    <span style="font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 5px;">Celková cena (tam i zpět):</span>
                    <span id="travel-result" style="font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 700; color: var(--accent);">0 Kč</span>
                </div>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">Sazba: 10 Kč/km (vzdálenost &times; 2 &times; 10 Kč)</p>
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <a href="index.html" class="btn btn-secondary" style="font-size: 0.85rem; padding: 8px 16px;">Zpět na hlavní web</a>
            </div>
        </div>
    </section>

    <script>
        function calculateTravel() {
            const distanceInput = document.getElementById('distance').value;
            const resultSpan = document.getElementById('travel-result');
            const ratePerKm = 10; 
            
            if (distanceInput && distanceInput > 0) {
                const totalCost = distanceInput * 2 * ratePerKm;
                resultSpan.textContent = totalCost + ' Kč';
            } else {
                resultSpan.textContent = '0 Kč';
            }
        }
    </script>
</body>
</html>

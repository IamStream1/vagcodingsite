<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop | VAG Coding & Diagnostika</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">VAG<span>Coding</span></a>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">← Zpět na hlavní web</a>
            </div>
        </div>
    </nav>

    <header class="hero" style="min-height: 35vh; padding-top: 120px;">
        <div class="hero-content">
            <h1>Nabídka <span>vybavení</span></h1>
            <p>Diagnostické kabely, příslušenství a doplňky pro vozy VAG.</p>
        </div>
    </header>

    <section class="services-section" style="background-color: var(--bg-dark); min-height: 40vh;">
        <div class="container">
            <div class="product-grid" id="public-product-grid">
                </div>
        </div>
    </section>

    <section id="admin-dashboard" class="admin-section" style="display: none;">
        <div class="container">
            <div class="admin-header">
                <h2 class="section-title" style="margin: 0; font-size: 1.8rem;">⚙️ Administrace produktů</h2>
                <button onclick="logoutAdmin()" class="btn btn-secondary">🚪 Odhlásit se</button>
            </div>

            <div class="admin-dashboard-grid">
                <div class="admin-card add-card">
                    <div class="card-icon">➕</div>
                    <h3>Nový produkt</h3>
                    <form onsubmit="handleAddProduct(event)">
                        <input type="text" id="add-name" class="admin-input" placeholder="Název produktu" required>
                        <textarea id="add-desc" class="admin-input" placeholder="Popis produktu" rows="3" required></textarea>
                        <input type="number" id="add-price" class="admin-input" placeholder="Cena (Kč)" required>
                        <label class="admin-label">Obrázek produktu:</label>
                        <input type="file" id="add-img" class="admin-input" accept="image/*" required>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Přidat produkt</button>
                    </form>
                </div>

                <div id="admin-product-list" style="display: contents;"></div>
            </div>
        </div>
    </section>

    <div id="productDetailModal" class="modal-overlay">
        <div class="modal-box">
            <span class="modal-close" onclick="closeProductModal()">&times;</span>
            <img id="modal-detail-img" src="" alt="Detail produktu" class="product-detail-img">
            <h3 id="modal-detail-title" style="font-family: 'Orbitron', sans-serif; color: var(--accent); margin-bottom: 15px; font-size: 1.4rem;"></h3>
            <p id="modal-detail-desc" style="color: var(--text-main); font-size: 0.95rem; line-height: 1.6; margin-bottom: 25px;"></p>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 20px;">
                <span id="modal-detail-price" style="font-size: 1.5rem; font-weight: 700; color: var(--text-main);"></span>
                <a id="modal-detail-buy" href="#" class="btn btn-primary">Koupit hned</a>
            </div>
        </div>
    </div>

    <div id="adminLoginModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 350px; padding: 40px 25px;">
            <span class="modal-close" onclick="closeAdminLoginModal()">&times;</span>
            <h3 style="font-family: 'Orbitron', sans-serif; margin-bottom: 20px; text-align: center;">🔒 Admin Login</h3>
            <div id="login-error" style="color: var(--accent); display: none; margin-bottom: 10px; font-size: 0.9rem; text-align: center;">Nesprávné jméno nebo heslo.</div>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="admin-user" class="admin-input" placeholder="Uživatelské jméno" required autocomplete="username">
                <input type="password" id="admin-pass" class="admin-input" placeholder="Heslo" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Přihlásit se</button>
            </form>
        </div>
    </div>

     <footer class="main-footer">
        <div class="container" style="display: flex; justify-content: center; align-items: center; gap: 15px;">
            <p style="margin: 0;">© 2026 Všechna práva vyhrazená.</p>
            <span onclick="openAdminLoginModal()" style="cursor: pointer; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">🔒 Admin Login</span>
        </div>
    </footer>

    <script>
        const defaultProducts = [
            { id: 1, name: "VCDS Diagnostický kabel (Klon)", desc: "Plně funkční kabel pro platformu VAG. Podpora vozů do roku 2023. Ideální pro domácí diagnostiku, čtení/mazání chyb, měřené hodnoty a základní kódování jednotek. Kódovací software VCDS je součástí dodávky.", price: 1200, image: "images/kabel.jpg", visible: true },
            { id: 2, name: "Sada LED žárovek interiéru", desc: "Kompletní sada CAN-BUS nehlásící chybu. Čistě bílé světlo 6000K. Balení obsahuje žárovky pro stropní lampičky (vpředu i vzadu), osvětlení kufru a přihrádky spolujezdce. Extrémní životnost a snadná výměna plug&play.", price: 650, image: "images/led.jpg", visible: true }
        ];

        let products = JSON.parse(localStorage.getItem('vag_products'));
        if (!products || products.length === 0) {
            products = defaultProducts;
            saveProducts();
        }

        function saveProducts() {
            localStorage.setItem('vag_products', JSON.stringify(products));
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // --- VYKRESLOVÁNÍ ---
        function renderApp() {
            const isAdmin = sessionStorage.getItem('vag_admin') === 'true';
            
            document.getElementById('admin-dashboard').style.display = isAdmin ? 'block' : 'none';
            
            const publicGrid = document.getElementById('public-product-grid');
            publicGrid.innerHTML = '';
            
            products.forEach(p => {
                if (p.visible || isAdmin) {
                    const visibilityBadge = (!p.visible && isAdmin) ? `<div style="position:absolute; top:10px; left:10px; background:var(--accent); color:#fff; padding:3px 8px; border-radius:4px; font-size:0.8rem; font-weight:bold; z-index:5;">SKRYTO</div>` : '';
                    const opacityStyle = (!p.visible && isAdmin) ? 'opacity: 0.5;' : '';
                    
                    // Zkrácení popisu pro kartu
                    const shortDesc = p.desc.length > 70 ? p.desc.substring(0, 70) + '...' : p.desc;

                    publicGrid.innerHTML += `
                        <div class="product-card clickable-card" style="position:relative; ${opacityStyle}" onclick="openProductModal(${p.id})">
                            ${visibilityBadge}
                            <img src="${p.image}" alt="${p.name}">
                            <div class="product-info">
                                <h3>${p.name}</h3>
                                <p class="product-desc">${shortDesc}</p>
                                <div class="product-bottom">
                                    <span class="product-price">${p.price} Kč</span>
                                    <span class="btn btn-secondary" style="padding: 5px 15px; font-size: 0.85rem;">Detail</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            if (isAdmin) {
                const adminList = document.getElementById('admin-product-list');
                adminList.innerHTML = '';
                
                products.forEach(p => {
                    adminList.innerHTML += `
                        <div class="admin-card">
                            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                                <img src="${p.image}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border);">
                                <div style="flex-grow: 1;">
                                    <input type="text" id="edit-name-${p.id}" class="admin-input" value="${p.name}" required>
                                    <input type="number" id="edit-price-${p.id}" class="admin-input" value="${p.price}" required>
                                </div>
                            </div>
                            <textarea id="edit-desc-${p.id}" class="admin-input" rows="3" required>${p.desc}</textarea>
                            
                            <label class="admin-label">Nahradit obrázek (nepovinné):</label>
                            <input type="file" id="edit-img-${p.id}" class="admin-input" accept="image/*">
                            
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border);">
                                <label class="toggle-switch">
                                    <input type="checkbox" ${p.visible ? 'checked' : ''} onchange="toggleVisibility(${p.id})">
                                    <span class="slider"></span>
                                    <span style="margin-left: 50px; font-size: 0.85rem; color: var(--text-muted);">Viditelný</span>
                                </label>
                                <div style="display: flex; gap: 10px;">
                                    <button onclick="saveEdit(${p.id})" class="btn btn-primary" style="padding: 6px 12px; font-size: 0.85rem;">Uložit</button>
                                    <button onclick="deleteProduct(${p.id})" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem; color: var(--accent); border-color: var(--accent);">Smazat</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // --- MODÁLNÍ OKNA A DETAIL PRODUKTU ---
        function openProductModal(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            
            document.getElementById('modal-detail-img').src = p.image;
            document.getElementById('modal-detail-title').innerText = p.name;
            document.getElementById('modal-detail-desc').innerText = p.desc;
            document.getElementById('modal-detail-price').innerText = p.price + ' Kč';
            
            const buyBtn = document.getElementById('modal-detail-buy');
            // Zabraňuje nákupu pokud je produkt skrytý, i pro admina v náhledu
            if (p.visible) {
                buyBtn.style.display = 'block';
                buyBtn.href = `checkout.html?product=${encodeURIComponent(p.name)}&price=${p.price}`;
            } else {
                buyBtn.style.display = 'none';
            }
            
            document.getElementById('productDetailModal').classList.add('show-modal');
        }

        function closeProductModal() {
            document.getElementById('productDetailModal').classList.remove('show-modal');
        }

        function openAdminLoginModal() {
            document.getElementById('adminLoginModal').classList.add('show-modal');
            document.getElementById('login-error').style.display = 'none';
        }

        function closeAdminLoginModal() {
            document.getElementById('adminLoginModal').classList.remove('show-modal');
        }

        // Zavření po kliknutí mimo box
        window.onclick = function(event) {
            const adminModal = document.getElementById('adminLoginModal');
            const prodModal = document.getElementById('productDetailModal');
            if (event.target === adminModal) closeAdminLoginModal();
            if (event.target === prodModal) closeProductModal();
        }

        // --- LOGIKA PŘIHLÁŠENÍ ADMINA ---
        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === 'admin' && pass === 'admin1212') {
                sessionStorage.setItem('vag_admin', 'true');
                document.getElementById('admin-pass').value = '';
                closeAdminLoginModal();
                renderApp();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('vag_admin');
            renderApp();
        }

        // --- LOGIKA PRODUKTŮ ---
        async function handleAddProduct(e) {
            e.preventDefault();
            const name = document.getElementById('add-name').value;
            const desc = document.getElementById('add-desc').value;
            const price = document.getElementById('add-price').value;
            const imgFile = document.getElementById('add-img').files[0];

            let imgData = "images/kabel.jpg"; 
            if (imgFile) imgData = await getBase64(imgFile);

            const newProduct = {
                id: Date.now(), name, desc, price: parseFloat(price), image: imgData, visible: true
            };
            products.push(newProduct);
            saveProducts();
            e.target.reset();
            renderApp();
        }

        async function saveEdit(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            product.name = document.getElementById(`edit-name-${id}`).value;
            product.price = parseFloat(document.getElementById(`edit-price-${id}`).value);
            product.desc = document.getElementById(`edit-desc-${id}`).value;
            
            const imgFile = document.getElementById(`edit-img-${id}`).files[0];
            if (imgFile) product.image = await getBase64(imgFile);

            saveProducts();
            renderApp();
            alert("Změny uloženy.");
        }

        function toggleVisibility(id) {
            const product = products.find(p => p.id === id);
            if (product) {
                product.visible = !product.visible;
                saveProducts();
                renderApp();
            }
        }

        function deleteProduct(id) {
            if (confirm("Opravdu chcete tento produkt smazat? Tato akce je nevratná.")) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>

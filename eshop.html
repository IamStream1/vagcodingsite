<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop | VAG Coding & Diagnostika</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">E-<span>Shop</span></a>
        </div>
    </nav>

<!-- HLAVIČKA E-SHOPU -->
    <header class="hero" style="padding-top: 120px; padding-bottom: 20px;">
        <div class="hero-content">
            <h1>Nabídka produktů</h1>
        </div>
    </header>

<section class="services-section" style="flex-grow: 1;">
        <div class="container">
            <div id="public-product-grid" class="product-grid">
                </div>
        </div>
    </section>

    <section id="admin-eshop-dashboard" class="admin-section" style="display: none;">
        <div class="container">
            <div class="admin-header">
                <h2 class="section-title" style="margin: 0; font-size: 1.8rem;">⚙️ Správa E-Shopu</h2>
                <button onclick="logoutAdmin()" class="btn btn-secondary">🚪 Odhlásit se</button>
            </div>

            <div class="admin-dashboard-grid" style="grid-template-columns: 1fr;">
                
                <div class="admin-card add-card" style="max-width: 600px; margin: 0 auto 30px;">
                    <div class="card-icon">➕</div>
                    <h3>Přidat nový produkt</h3>
                    <form onsubmit="handleAddProduct(event)">
                        <input type="text" id="add-product-name" class="admin-input" placeholder="Název produktu (např. VCDS Kabel)" required>
                        <textarea id="add-product-desc" class="admin-input" placeholder="Popis produktu..." rows="3" required></textarea>
                        <input type="number" id="add-product-price" class="admin-input" placeholder="Cena (Kč)" required>
                        
                        <label class="admin-label">Fotografie produktu:</label>
                        <input type="file" id="add-product-file" class="admin-input" accept="image/*" required>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Přidat produkt do cloudu</button>
                    </form>
                </div>

                <div>
                    <h3 style="font-family: 'Orbitron', sans-serif; margin-bottom: 15px; color: var(--accent);">Pořadí a úpravy (Přetáhněte myší pro změnu pořadí)</h3>
                    <div id="admin-product-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
                </div>

            </div>
        </div>
    </section>

    <div id="adminLoginModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 350px; padding: 40px 25px;">
            <span class="modal-close" onclick="closeAdminLoginModal()">×</span>
            <h3 style="font-family: 'Orbitron', sans-serif; margin-bottom: 20px; text-align: center;">🔒 Admin Login</h3>
            <div id="login-error" style="color: var(--accent); display: none; margin-bottom: 10px; font-size: 0.9rem; text-align: center;">Nesprávné jméno nebo heslo.</div>
            <form onsubmit="handleAdminLogin(event)">
                <input type="text" id="admin-user" class="admin-input" placeholder="Uživatelské jméno" required autocomplete="username">
                <input type="password" id="admin-pass" class="admin-input" placeholder="Heslo" required autocomplete="current-password">
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Přihlásit se</button>
            </form>
        </div>
    </div>

<footer class="main-footer">
        <div class="container" style="display: flex; justify-content: center; align-items: center; gap: 15px;">
            <p style="margin: 0;">© 2026 Všechna práva vyhrazená.</p>
            <span onclick="openAdminLoginModal()" style="cursor: pointer; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">🔒 Admin Login</span>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <script>
        // --- 1. FIREBASE NASTAVENÍ (Stejné jako v index.html) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCxKk68YfB9uerCr9UZ1gOJanuCTa3fXTM",
            authDomain: "vagcoding-e1192.firebaseapp.com",
            projectId: "vagcoding-e1192",
            storageBucket: "vagcoding-e1192.firebasestorage.app",
            messagingSenderId: "499306352311",
            appId: "1:499306352311:web:341225ebfe04530aa70732",
            measurementId: "G-90BNY64SXQ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // --- 2. DATA Z CLOUDU ---
        let productsData = [];

        async function loadProducts() {
            try {
                // E-shop se ukládá do dokumentu "eshop" (galerie je v "gallery")
                const doc = await db.collection('settings').doc('eshop').get();
                if (doc.exists) {
                    productsData = doc.data().items || [];
                }
                renderPublicProducts();
                checkAdmin();
            } catch (error) {
                console.error("Chyba při načítání e-shopu:", error);
            }
        }

        async function saveProducts() {
            try {
                await db.collection('settings').doc('eshop').set({ items: productsData });
                return true;
            } catch (e) {
                alert("Chyba při ukládání do cloudu: " + e.message);
                return false;
            }
        }

        // --- 3. VYKRESLENÍ PRODUKTŮ ---
        function renderPublicProducts() {
            const grid = document.getElementById('public-product-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            const visibleItems = productsData.filter(item => item.visible);
            
            if (visibleItems.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); width: 100%; text-align: center; grid-column: 1 / -1;">Žádné produkty momentálně nejsou v nabídce.</p>';
                return;
            }

            visibleItems.forEach((product) => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}">
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <p class="product-desc">${product.desc}</p>
                            <div class="product-bottom">
                                <span class="product-price">${product.price} Kč</span>
                                <a href="index.html#kontakt" class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;">Mám zájem</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- 4. ADMINISTRACE E-SHOPU ---
        function checkAdmin() {
            const isAdmin = sessionStorage.getItem('vag_gallery_admin') === 'true';
            const adminSection = document.getElementById('admin-eshop-dashboard');
            if(adminSection) adminSection.style.display = isAdmin ? 'block' : 'none';
            if (isAdmin) renderAdminProducts();
        }

        function openAdminLoginModal() {
            document.getElementById('adminLoginModal').classList.add('show-modal');
            document.getElementById('login-error').style.display = 'none';
        }
        function closeAdminLoginModal() {
            document.getElementById('adminLoginModal').classList.remove('show-modal');
        }
        function handleAdminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;

            if (user === 'admin' && pass === 'admin1212') {
                sessionStorage.setItem('vag_gallery_admin', 'true');
                document.getElementById('admin-pass').value = '';
                closeAdminLoginModal();
                checkAdmin();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }
        function logoutAdmin() {
            sessionStorage.removeItem('vag_gallery_admin');
            checkAdmin();
        }

        async function handleAddProduct(e) {
            e.preventDefault();
            const name = document.getElementById('add-product-name').value;
            const desc = document.getElementById('add-product-desc').value;
            const price = document.getElementById('add-product-price').value;
            const file = document.getElementById('add-product-file').files[0];

            if (!file) return alert('Vyberte fotografii produktu!');
            if (file.size > 20000000) return alert('Obrázek je moc velký! (Max 20MB)');

            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Nahrávám fotografii... (čekejte)";
            btn.disabled = true;

            try {
                // 1. Nahrání obrázku produktu do Firebase Storage (složka eshop)
                const storageRef = storage.ref('eshop/' + Date.now() + '_' + file.name);
                await storageRef.put(file);
                
                // 2. Získání odkazu
                const imageSrc = await storageRef.getDownloadURL();

                // 3. Uložení dat produktu
                const newProduct = { 
                    id: Date.now().toString(), 
                    name, 
                    desc, 
                    price, 
                    image: imageSrc, 
                    visible: true 
                };
                
                productsData.unshift(newProduct);
                await saveProducts();

                e.target.reset();
                renderPublicProducts();
                renderAdminProducts();
            } catch(error) {
                alert("Nahrávání selhalo: " + error.message);
                console.error(error);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function deleteProduct(id) {
            if(confirm("Opravdu smazat tento produkt?")) {
                const item = productsData.find(i => i.id === id);
                if (item && item.image.includes('firebasestorage')) {
                    try { await storage.refFromURL(item.image).delete(); } catch(e) {}
                }
                productsData = productsData.filter(i => i.id !== id);
                await saveProducts();
                renderPublicProducts();
                renderAdminProducts();
            }
        }

        async function toggleProductVisibility(id) {
            const item = productsData.find(i => i.id === id);
            if(item) {
                item.visible = !item.visible;
                await saveProducts();
                renderPublicProducts();
                renderAdminProducts();
            }
        }

        // --- 5. DRAG AND DROP (Pořadí produktů) ---
        let draggedItemId = null;

        function renderAdminProducts() {
            const list = document.getElementById('admin-product-list');
            list.innerHTML = '';
            
            productsData.forEach(item => {
                const eyeColor = item.visible ? 'var(--accent)' : '#555';
                const eyeText = item.visible ? 'Viditelné' : 'Skryté';

                list.innerHTML += `
                    <div class="admin-gallery-row" draggable="true" 
                         ondragstart="dragStart(event, '${item.id}')" 
                         ondragover="dragOver(event)" 
                         ondragleave="dragLeave(event)" 
                         ondrop="drop(event, '${item.id}')">
                        
                        <div style="display:flex; align-items:center; gap:15px; pointer-events:none;">
                            <span style="cursor:grab; font-size:1.2rem;">☰</span>
                            <img src="${item.image}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;">
                            <strong style="color:var(--text-main);">${item.name}</strong>
                            <span style="color:var(--accent); font-weight:bold;">${item.price} Kč</span>
                        </div>
                        
                        <div style="display:flex; gap:10px;">
                            <button onclick="toggleProductVisibility('${item.id}')" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem; color:${eyeColor}; border-color:${eyeColor};">${eyeText}</button>
                            <button onclick="deleteProduct('${item.id}')" class="btn btn-primary" style="padding: 4px 10px; font-size: 0.8rem;">Smazat</button>
                        </div>
                    </div>
                `;
            });
        }

        function dragStart(e, id) { draggedItemId = id; e.dataTransfer.effectAllowed = 'move'; }
        function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
        function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
        async function drop(e, targetId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            
            if (draggedItemId === targetId) return;

            const fromIndex = productsData.findIndex(i => i.id === draggedItemId);
            const toIndex = productsData.findIndex(i => i.id === targetId);
            
            const [movedItem] = productsData.splice(fromIndex, 1);
            productsData.splice(toIndex, 0, movedItem);
            
            await saveProducts();
            renderPublicProducts();
            renderAdminProducts();
        }

        // Zavírání oken
        window.onclick = function(event) {
            if (event.target === document.getElementById('adminLoginModal')) closeAdminLoginModal();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAdminLoginModal();
        });

        // START
        loadProducts();
    </script>

</body>
</html>
